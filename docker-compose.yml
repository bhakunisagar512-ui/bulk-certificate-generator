# All credentials come from .env (created by ./setup.sh). Nothing is hard-coded here.
# db and redis are NOT published to the host: only the API port is reachable.

x-app: &app
  build: .
  image: certgen:latest
  restart: unless-stopped
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
    REDIS_URL: redis://redis:6379/0
    STORAGE_DIR: /data/certificates
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  security_opt:
    - no-new-privileges:true
  networks: [internal]

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  api:
    <<: *app
    # Migrations run before the server starts (only this service runs them).
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - certs:/data/certificates
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    <<: *app
    command: celery -A app.worker.celery_app.celery_app worker --loglevel=INFO --concurrency=4
    volumes:
      - certs:/data/certificates
    depends_on:
      api: {condition: service_healthy}

  beat:
    <<: *app
    command: celery -A app.worker.celery_app.celery_app beat --loglevel=INFO --schedule /tmp/celerybeat/schedule
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:
  certs:

networks:
  internal:
